name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          # Decky Loader v3.3.1 bundles Python 3.14 (tests/test_decky_runtime.py needs it)
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:frontend
      - run: pnpm run build
      - run: SKIP_BUILD=1 bash scripts/package.sh
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: moondeck-apollo
          path: out/moondeck-apollo.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/moondeck-apollo.zip
            out/moondeck-apollo.zip.sha256
